<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Открываем в приложении…</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
      color: #e8e8e8;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .box {
      max-width: 520px;
      text-align: center;
    }
    .duck {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 19px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    p {
      margin: 0 0 8px;
      color: #a8a8a8;
    }
    code {
      color: #d8d8d8;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <img class="duck" src="icons/icon128.png" alt="">
      <h1>Открываем ссылку в приложении…</h1>
      <p>Если окно с вопросом «Открыть в приложении?» не появилось, значит в системе нет обработчика <code>tg://</code>.</p>
      <div id="fallback" hidden>
        <p>Ссылка: <code id="target"></code></p>
      </div>
    </div>
  </div>
  <script src="open.js"></script>
</body>
</html>
